Global:
  model_name: PP-OCRv6_small_rec
  debug: false
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./output/mixed2_small_rec_rtlfix
  save_epoch_step: 2
  eval_batch_step: [0, 3000]
  cal_metric_during_train: true
  pretrained_model: ./pretrain_models/PP-OCRv6_small_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir: ./output/mixed2_small_rec_rtlfix/inference
  use_visualdl: false
  infer_img: ./data/mixed2_data_20261119/images/val_word_6910.jpg
  character_dict_path: ./data/mixed2_data_20261119/dict_no_space.txt
  max_text_length: &max_text_length 42  # Reserve NRTR start/end tokens for 40-character labels.
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/mixed2_small_rec_rtlfix/predicts.txt
  d2s_train_image_shape: [3, 48, 320]
  use_ema: true
  ema_decay: 0.9998
  ema_decay_type: threshold
  early_stop:
    enable: true
    trigger_acc: 0.9
    patience: 5
    min_delta: 0.001

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: small
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: lightsvtr
          dims: 120
          depth: 2
          mlp_ratio: 2.0
          local_kernel: 7
          use_guide: false
        Head:
          fc_decay: 0.00001
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss:
  - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false
  is_filter: false

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./data/mixed2_data_20261119
    ext_op_transform_idx: 1
    label_file_list:
    - ./data/mixed2_data_20261119/train.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.0
        ext_data_num: 1
        image_shape: [48, 320, 3]
        max_text_length: 40  # Keep concatenated text within the 40-character data limit.
    - RecAug:
        tia_prob: 0.25
        crop_prob: 0.15
        reverse_prob: 0.0
        noise_prob: 0.3
        jitter_prob: 0.2
        blur_prob: 0.25
        hsv_aug_prob: 0.2
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 64
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 64

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/mixed2_data_20261119
    label_file_list:
    - ./data/mixed2_data_20261119/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: *bs
    num_workers: 16
